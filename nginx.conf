limit_req_zone $binary_remote_addr zone=spa:10m rate=120r/m;

map $uri $is_scanner {
    default 0;

    # --- Allow legitimate project paths (maintain these as routes evolve) ---
    "~^/robots.txt$"           0;
    "~^/sitemap.xml$"          0;
    "~^/favicon"               0;
    "~^/manifest.webmanifest$" 0;

    # --- Framework / internal paths ---
    "~*^/_next/"               1;
    "~*^/_vercel/"             1;
    "~*^/_nuxt/"               1;
    "~*^/_profiler"            1;
    "~*^/_debug"               1;
    "~*^/_rsc"                 1;
    "~*^/__debug"              1;
    "~*^/__nextjs"             1;

    # --- Spring Boot / Actuator ---
    "~*^/actuator"             1;

    # --- VCS, secrets, config files ---
    "~*^/\.(git|svn|hg|bzr)"   1;
    "~*/\.env"                 1;
    "~*/credentials\.json$"    1;
    "~*/secrets\.json$"        1;
    "~*/service-account\.json$" 1;
    "~*/swagger\.json$"        1;
    "~*/openapi\.json$"        1;
    "~*/package\.json$"        1;
    "~*/composer\."            1;
    "~*/bun\.lock"             1;
    "~*/yarn\.lock$"           1;
    "~*/pnpm-lock\.yaml$"      1;
    "~*/docker-compose\."      1;
    "~*/Dockerfile$"           1;
    "~*/dump\.sql$"            1;
    "~*/terraform"             1;
    "~*/\.tfstate"             1;
    "~*/\.tfvars"              1;
    "~*/web\.config$"          1;
    "~*/nginx\.conf$"          1;
    "~*/httpd\.conf$"          1;

    # --- CMS (WordPress, Joomla, etc.) ---
    "~*^/wp-"                  1;
    "~*^/wordpress"            1;
    "~*^/xmlrpc"               1;
    "~*^/administrator"        1;
    "~*^/phpmyadmin"           1;
    "~*^/pma"                  1;

    # --- Admin / Management ---
    "~*^/console"              1;
    "~*^/controlpanel"         1;
    "~*^/manager/html"         1;
    "~*^/webmin"               1;
    "~*^/sysadmin"             1;
    "~*^/sysinfo"              1;
    "~*^/balancer-manager"     1;
    "~*^/server-status"        1;
    "~*^/server-info"          1;
    "~*^/elmah"                1;

    # --- CI/CD ---
    "~*^/jenkins"              1;
    "~*^/hudson"               1;

    # --- Metrics / Monitoring ---
    "~*^/metrics"              1;
    "~*^/prometheus"           1;

    # --- Cloud provider probes ---
    "~*^/aws"                  1;
    "~*^/firebase"             1;
    "~*/s3[-\.]"               1;
    "~*^/stripe"               1;
    "~*^/sendgrid"             1;

    # --- PHP / CGI ---
    "~*^/cgi-bin/"             1;
    "~*^/phpinfo"              1;
    "~*^/info\.php$"           1;

    # --- Automation / Bots ---
    "~*^/oauth/"               1;
    "~*^/rest/"                1;
    "~*^/solr/"                1;
    "~*^/telescope"            1;
    "~*^/horizon"              1;
    "~*^/graphql"              1;

    # --- Backup / Temp / Logs ---
    "~*^/backup"               1;
    "~*^/vendor/"              1;
    "~*^/storage/"             1;
    "~*^/tmp/"                 1;
    "~*^/temp/"                1;
    "~*^/logs/"                1;

    # --- Proc / System files ---
    "~*^/proc/"                1;

    # --- Port probing ---
    "~*^/:%d{4,5}$"            1;
    "~*^/%3a\d{4,5}$"          1;

    # --- Double encoding / Path traversal ---
    "~*%2f"                    1;
    "~*%25"                    1;
    "~*%c0"                    1;
    "~*%e0"                    1;
    "~\."                      1;

    # --- Dangerous file extensions (not served by this SPA) ---
    "~*\.php$"                 1;
    "~*\.xml$"                 1;
    "~*\.cgi$"                 1;
    "~*\.asp$"                 1;
    "~*\.aspx$"                1;
    "~*\.jsp$"                 1;
    "~*\.war$"                 1;
    "~*\.bak$"                 1;
    "~*\.old$"                 1;
    "~*\.save$"                1;
}

map $http_user_agent $is_browser {
    default 0;
    "~*Mozilla"  1;
    "~*Chrome"   1;
    "~*Safari"   1;
    "~*Firefox"  1;
    "~*Edg"      1;
    "~*Opera"    1;
    "~*OPR"      1;
    "~*Brave"    1;
    "~*Vivaldi"  1;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(self \"https://js.stripe.com\"), usb=(), interest-cohort=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://js.stripe.com https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https://*.tile.openstreetmap.org https://api.mapbox.com https://img.youtube.com; connect-src 'self' https://api.stripe.com https://m.stripe.com https://r.stripe.com https://q.stripe.com https://api.mapbox.com; frame-src https://js.stripe.com https://hooks.stripe.com; font-src 'self' data: https://fonts.gstatic.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # GZIP
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Proxy API requests to backend (backend handles its own rate limiting with real client IP)
    location /api/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # SPA fallback - all routes go to index.html
    location / {
        limit_req zone=spa burst=30 nodelay;
        limit_req_status 429;

        if ($is_scanner) {
            return 444;
        }

        if ($is_browser = 0) {
            return 404;
        }

        try_files $uri $uri/ /index.html;
    }

    # No cache for index.html (ensure latest version)
    location = /index.html {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(self \"https://js.stripe.com\"), usb=(), interest-cohort=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://js.stripe.com https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https://*.tile.openstreetmap.org https://api.mapbox.com https://img.youtube.com; connect-src 'self' https://api.stripe.com https://m.stripe.com https://r.stripe.com https://q.stripe.com https://api.mapbox.com; frame-src https://js.stripe.com https://hooks.stripe.com; font-src 'self' data: https://fonts.gstatic.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }

    # No cache for version.json
    location = /version.json {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(self \"https://js.stripe.com\"), usb=(), interest-cohort=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://js.stripe.com https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https://*.tile.openstreetmap.org https://api.mapbox.com https://img.youtube.com; connect-src 'self' https://api.stripe.com https://m.stripe.com https://r.stripe.com https://q.stripe.com https://api.mapbox.com; frame-src https://js.stripe.com https://hooks.stripe.com; font-src 'self' data: https://fonts.gstatic.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Access-Control-Allow-Origin "*" always;
        try_files $uri =404;
    }

    # Cache static assets with hashed filenames (Vite adds content hash)
    location /assets/ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(self \"https://js.stripe.com\"), usb=(), interest-cohort=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://js.stripe.com https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https://*.tile.openstreetmap.org https://api.mapbox.com https://img.youtube.com; connect-src 'self' https://api.stripe.com https://m.stripe.com https://r.stripe.com https://q.stripe.com https://api.mapbox.com; frame-src https://js.stripe.com https://hooks.stripe.com; font-src 'self' data: https://fonts.gstatic.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Avoid stale translations after deploys.
    location /locales/ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(self \"https://js.stripe.com\"), usb=(), interest-cohort=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://js.stripe.com https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https://*.tile.openstreetmap.org https://api.mapbox.com https://img.youtube.com; connect-src 'self' https://api.stripe.com https://m.stripe.com https://r.stripe.com https://q.stripe.com https://api.mapbox.com; frame-src https://js.stripe.com https://hooks.stripe.com; font-src 'self' data: https://fonts.gstatic.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        try_files $uri =404;
    }
}
